    <div class="login-page">
        <div class="login-container" style="margin:0 auto;">
            <div class="login-card">

                </div>
                <h2>Set a new password</h2>

                <div id="resetMessage"></div>
                <form id="resetPasswordForm">
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="newPassword" name="new_password" placeholder="New password" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="newPassword" title="Show password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="confirmPassword" title="Show password" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                    <div id="pwHints" class="pw-hints"></div>
                    <button type="submit" class="login-btn">Update Password</button>
                </form>

    <script src="shared/js/login.js?v=guest-shop3"></script>
    <script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token") || "";
        const form = document.getElementById("resetPasswordForm");
        const message = document.getElementById("resetMessage");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        if (window.phProfileValidate) {
            window.phProfileValidate.bindHints(newPassword, document.getElementById("pwHints"));
        }
        if (!token) {
            form.style.display = "none";
            message.innerHTML = '<div class="message error">This reset link is missing a token. Request a new one from the login page.</div>';
            return;
        }
        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            const next = newPassword.value;
            const confirm = confirmPassword.value;
            const localErr = window.phProfileValidate
                ? window.phProfileValidate.newPasswordError(next)
                : "";
            if (localErr) {
                message.innerHTML = `<div class="message error">${localErr}</div>`;
                return;
            }
            if (next !== confirm) {
                message.innerHTML = '<div class="message error">New passwords do not match.</div>';
                return;
            }
            const submitBtn = form.querySelector("button[type=submit]");
            submitBtn.disabled = true;
            submitBtn.textContent = "Updating...";
            try {
                const res = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        token,
                        new_password: next,
                        confirm_password: confirm
                    })
                });
                const result = await res.json();
                message.innerHTML = `<div class="message ${result.success ? "success" : "error"}">${result.message}</div>`;
                if (result.success) {
                    form.reset();
                    setTimeout(() => { window.location.href = "/"; }, 1800);
                }
            } catch (err) {
                message.innerHTML = '<div class="message error">Something went wrong. Please try again.</div>';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Update Password";
            }
        });
    })();
    </script>
</body>
</html>
