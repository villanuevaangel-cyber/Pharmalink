name: Deploy PharmaLink to Hostinger

on:
  push:
    branches:
      - cursor/render-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pharmalink-hostinger-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate changed source syntax
        run: |
          python -m compileall -q app
          node --check customer/js/customer-boot.js
          node --check cashier/js/cashier-boot.js

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_SSH_KEY"
          test -n "$HOSTINGER_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          python - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["HOSTINGER_SSH_KEY"].strip()
          if "\\n" in key and "\n" not in key:
              key = key.replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          Path.home().joinpath(".ssh", "pharmalink_deploy").write_text(
              key.rstrip() + "\n", encoding="utf-8"
          )
          PY
          chmod 600 "$HOME/.ssh/pharmalink_deploy"
          if ! ssh-keygen -y -f "$HOME/.ssh/pharmalink_deploy" >/dev/null 2>&1; then
            echo "HOSTINGER_SSH_KEY is not a readable unencrypted OpenSSH private key. Check for literal \\n escapes or replace it with the private key matching the VPS authorized key; do not use the .pub key." >&2
            exit 1
          fi
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          python deploy/hostinger/prepare_known_hosts.py

      - name: Deploy and restart service
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          port="${HOSTINGER_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/pharmalink_deploy" \
            -p "$port" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'if ! command -v tesseract >/dev/null 2>&1; then sudo -n /usr/bin/apt-get update && sudo -n /usr/bin/apt-get install -y tesseract-ocr; fi &&
             sudo -n -u www-data /usr/bin/git -C /var/www/pharmalink pull --ff-only origin cursor/render-deploy &&
             sudo -n -u www-data /var/www/pharmalink/venv/bin/pip install -r /var/www/pharmalink/requirements.txt &&
             sudo -n /usr/bin/systemctl restart pharmalink &&
             sudo -n /usr/bin/systemctl is-active --quiet pharmalink &&
             sudo -n -u www-data /var/www/pharmalink/venv/bin/python /var/www/pharmalink/deploy/hostinger/check_smtp.py'
